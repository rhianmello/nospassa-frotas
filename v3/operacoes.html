<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XRMOVI | Operações da frota</title><style>
:root{font:14px system-ui;color-scheme:dark}*{box-sizing:border-box}body{background:#071626;color:#ebf4ff;margin:0}a{color:#35ddc0}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 30px;background:#0c2235;border-bottom:1px solid #315167}main{padding:22px max(18px,3vw);max-width:1500px;margin:auto}h1{margin:0;font-size:24px}h2{font-size:19px;margin:7px 0}p,small{color:#9fb9ce}button,input,select,textarea{font:inherit}button{cursor:pointer;padding:10px 14px;background:#154059;color:#eaf7ff;border:1px solid #3b647a;border-radius:9px}button.primary{background:#2bd4b6;color:#092130;border:0;font-weight:800}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{padding:10px;background:#0a2033;color:white;border:1px solid #365d74;border-radius:8px;width:100%;min-width:0}label{display:grid;gap:6px;font-size:12px;color:#a8c1d2}.top{display:flex;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:20px 0}.top label{min-width:240px}.modules{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.modules button.active{background:#2bd4b6;color:#071725;font-weight:800}.panel{background:#0f293d;border:1px solid #31536b;border-radius:14px;padding:19px;margin:14px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summary strong{font-size:26px;display:block;margin-top:5px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls input{max-width:330px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #33536b;font-size:12px}th{color:#a9c4d6}.empty{padding:25px;color:#9db6c7}dialog{background:#102c42;color:#ecf6fc;border:1px solid #416780;border-radius:14px;width:min(740px,95vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#031019d9}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}#message{min-height:18px;color:#ffd280}.hidden{display:none!important}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.wide{grid-column:1}}
</style></head><body><header><div><small>XRMOVI · OPERAÇÃO INTEGRADA</small><h1 id="title">Gestão operacional</h1></div><div><a href="./">Frota</a> · <a href="./os.html">Ordens de serviço</a></div></header><main>
<div id="loginPanel" class="panel hidden" style="max-width:440px;margin:9vh auto"><h2>Entrar</h2><form id="loginForm"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><p><button class="primary">Acessar</button></p></form></div>
<div id="workspace" class="hidden"><div class="top"><label>Empresa selecionada<select id="company"></select></label><button class="primary" id="add">+ Novo registro</button></div><nav class="modules" id="modules"></nav><div class="summary"><div class="panel"><small>Total</small><strong id="total">0</strong></div><div class="panel"><small>Em aberto</small><strong id="open">0</strong></div><div class="panel"><small>Em atenção</small><strong id="attention">0</strong></div></div><section class="panel"><div class="controls"><label>Pesquisar<input id="search" placeholder="Título, código, local, responsável"></label><button id="reload">Atualizar</button></div><div class="table"><table><thead><tr><th>Título</th><th>Código</th><th>Situação</th><th>Local</th><th>Responsável</th><th>Prazo</th><th>Saldo / Quantidade</th><th>Custo</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty hidden">Nenhum registro neste módulo.</p></section></div><p id="message" role="status"></p></main>
<dialog id="editor"><h2 id="editorTitle">Registro</h2><form id="recordForm"><div class="fields"><label>Título<input name="title" required minlength="3" maxlength="180"></label><label>Código / identificação<input name="code" maxlength="80"></label><label>Situação<select name="status"><option value="aberto">Aberto</option><option value="planejado">Planejado</option><option value="em_execucao">Em execução</option><option value="em_atencao">Em atenção</option><option value="concluido">Concluído</option></select></label><label>Local / setor<input name="location" maxlength="200"></label><label>Responsável<input name="assigned" maxlength="120"></label><label>Prazo<input name="due" type="date"></label><label>Quantidade / saldo<input name="qty" type="number" min="0" step="any" value="0"></label><label>Estoque mínimo<input name="min" type="number" min="0" step="any" value="0"></label><label>Unidade<input name="unit" placeholder="un, kg, litros, ..." maxlength="30"></label><label>Custo (R$)<input name="cost" type="number" step=".01" min="0" value="0"></label><label class="wide">Ordem de serviço vinculada<select name="order" id="order"><option value="">Sem vínculo</option></select></label><label class="wide">Descrição, critérios ou observações<textarea name="description" rows="4"></textarea></label></div><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></div></form></dialog><script type="module" src="./operacoes.js?v=20261029-fleet-3"></script></body></html>
