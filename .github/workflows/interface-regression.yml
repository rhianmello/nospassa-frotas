name: XRMOVI interface and public access
on:
  push:
    paths: ['index.html', 'auth/**', 'v3/**', 'termos/**', 'privacidade/**', 'cancelamento/**', 'legal/**', 'tests/**', 'package*.json', '.github/workflows/interface-regression.yml']
  pull_request:
    paths: ['index.html', 'auth/**', 'v3/**', 'termos/**', 'privacidade/**', 'cancelamento/**', 'legal/**', 'tests/**', 'package*.json', '.github/workflows/interface-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Public authentication and fleet interface (offline mocks)
        run: npm run test:browser
