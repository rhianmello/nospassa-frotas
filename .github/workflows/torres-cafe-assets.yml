name: Torres Cafe - guardar imagens no repositorio
on:
  push:
    paths:
      - '.github/workflows/torres-cafe-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar imagens e substituir URLs temporarias
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          import os, urllib.request, time, subprocess
          urls = {
            "embalagem": "https://media.canva.com/v2/image-resize/format:JPG/height:198/quality:75/uri:ifs%3A%2F%2FM%2Fecf4b8ac-39ed-4ef9-92fe-8692b7841291/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAD2xw2-fbJXqcio82R5otGhlYiECLT-ENo4lACcExfkN&exp=1795316669&osig=AAAAAAAAAAAAAAAAAAAAAGJXB02BHpiMBFluk8mlxn3dIFKNGDIFuKi1eWU3MMwW&signer=media-rpc&token=AAIAAU0AJGVjZjRiOGFjLTM5ZWQtNGVmOS05MmZlLTg2OTJiNzg0MTI5MQAAAAABogE2WkgknstlRIjDV83DTfAJZwwwwhhBc4w7mC9mfMZTGmeQhA&x-canva-quality=thumbnail",
            "espresso": "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F877c4842-5cd3-40ea-986d-0f6616e9deb6/watermark:F/width:159?csig=AAAAAAAAAAAAAAAAAAAAAHztnmhSiO61eYLJeIcqInRW4KuW04KvM65fEOdI-fd0&exp=1795315845&osig=AAAAAAAAAAAAAAAAAAAAAFpMT77CI01Ztj4EdC0OQdR4DgP3ZsPv7hCze-my4wbL&signer=media-rpc&token=AAIAAU0AJDg3N2M0ODQyLTVjZDMtNDBlYS05ODZkLTBmNjYxNmU5ZGViNgAAAAABogEpx4gs3JcTKyEgugK3ogdPb_uiC-Koeo1LMzg-s3N2o8e1zQ&x-canva-quality=thumbnail",
            "marca": "https://media.canva.com/v2/image-resize/format:JPG/height:196/quality:75/uri:ifs%3A%2F%2FM%2Ff4b12ffd-b82a-4cbc-a319-2509e63f2c85/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABPoAAMWUcbUBux-ZDkYw8PsK1vrkH1oStIniEiWzglV&exp=1795315219&osig=AAAAAAAAAAAAAAAAAAAAAE8vk5SHV3Q9f7LbKXjRHQS3LIxqxZZjrQxvsicr5zQ4&signer=media-rpc&token=AAIAAU0AJGY0YjEyZmZkLWI4MmEtNGNiYy1hMzE5LTI1MDllNjNmMmM4NQAAAAABogEgOjhZgtj0ZDmUmjEljdPSgS2QpGz-9FiDbXHeEcv-EeEcTA&x-canva-quality=thumbnail",
            "secagem": "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F09a2f9e6-6f61-4242-9151-302883b8de1a/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAADo2bNw4irDqQwIUb-486ecnitMEirrjzzUQZ32Z-zi7&exp=1795315468&osig=AAAAAAAAAAAAAAAAAAAAALkJWDYvQR_A4Iz8V37RxtQ6BSzTMkya_W4jOQhSN4vi&signer=media-rpc&token=AAIAAU0AJDA5YTJmOWU2LTZmNjEtNDI0Mi05MTUxLTMwMjg4M2I4ZGUxYQAAAAABogEkBuBL1g9uNK-YtuPP1riIH1kImOjMconsRMN90kBVcQTt2Q&x-canva-quality=thumbnail",
            "terreiro": "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F82b49e86-9490-4293-a40c-93fbebb40784/watermark:F/width:152?csig=AAAAAAAAAAAAAAAAAAAAAE3TlFD3cXn3uzXaOJ0mctKiwrduEsXeBKh5bQZgy7ux&exp=1795315519&osig=AAAAAAAAAAAAAAAAAAAAAHjOHSRSP7mL5XqRMZfEwIzfO2gYFsdUpKEte3QU7k1q&signer=media-rpc&token=AAIAAU0AJDgyYjQ5ZTg2LTk0OTAtNDI5My1hNDBjLTkzZmJlYmI0MDc4NAAAAAABogEkzhj6ZN5aOvfuSvjjI8DabCPkKwA6Gf9CWu32zaAxj8EqfA&x-canva-quality=thumbnail",
            "colheita": "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F453aec4e-df3d-4ac9-91d6-fbfafaa5e639/watermark:F/width:198?csig=AAAAAAAAAAAAAAAAAAAAAMSoBgJo9dXUEQghf_Fi0iDxGL35lXD0QbbigOPoCl6q&exp=1795316737&osig=AAAAAAAAAAAAAAAAAAAAAPFlPHOAZGhxdcXNWfnq9K5A3zhSguplXdGYnUznAmav&signer=media-rpc&token=AAIAAU0AJDQ1M2FlYzRlLWRmM2QtNGFjOS05MWQ2LWZiZmFmYWE1ZTYzOQAAAAABogE3Y-iVvC66cuZnTl6Msv1x5EzMuYA8pHfgu_f9ecsMHS6WCA&x-canva-quality=thumbnail",
            "linha": "https://media.canva.com/v2/image-resize/format:JPG/height:197/quality:75/uri:ifs%3A%2F%2FM%2F70221ddf-0e88-40e9-b0dd-29b75ee8d6b0/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMex79cOSFzqqRRlOUCUiBnGY-ffkPdWiXC1TWrfNvJT&exp=1795316224&osig=AAAAAAAAAAAAAAAAAAAAANSvJkL3CWkGpMJ6Yl_lvBLpQquTAZxaZHRkBvVtK5ab&signer=media-rpc&token=AAIAAU0AJDcwMjIxZGRmLTBlODgtNDBlOS1iMGRkLTI5Yjc1ZWU4ZDZiMAAAAAABogEvkADZj2nIgoxQeSx4YoT_U7Pe4cO1Ykg395QK3WwHBgPclQ&x-canva-quality=thumbnail",
            "torra": "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Fcb51b989-b8e8-4b55-a882-940933bbe959/watermark:F/width:154?csig=AAAAAAAAAAAAAAAAAAAAANA6i_mhXIsdgNxkUBVUQQ7bq5WEJ0tb9atyjNOEk2Y0&exp=1795317525&osig=AAAAAAAAAAAAAAAAAAAAAGwdq4qyCQPu38bFguNaOPURCqk1ED2nGruJw0JBMl43&signer=media-rpc&token=AAIAAU0AJGNiNTFiOTg5LWI4ZTgtNGI1NS1hODgyLTk0MDkzM2JiZTk1OQAAAAABogFDaggJ6j8BUTHVUvPPbd4o6LlytgKIi4VITK2aYKsl1Uvy_Q&x-canva-quality=thumbnail",
            "classificacao": "https://media.canva.com/v2/image-resize/format:JPG/height:198/quality:75/uri:ifs%3A%2F%2FM%2F5003023b-3136-4be0-b56f-3a479adc3d04/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPk3t_6NGBCpXpiAWcCz17D2y7bT5iVGCk6X7TDMM3Dm&exp=1795316407&osig=AAAAAAAAAAAAAAAAAAAAANtbIKCsxskqhflKngNNbem8LKuWk-GILIis5uwqsSiM&signer=media-rpc&token=AAIAAU0AJDUwMDMwMjNiLTMxMzYtNGJlMC1iNTZmLTNhNDc5YWRjM2QwNAAAAAABogEyWthWeswUd6-UgwQG_NnhLLCdr5mrP94NqM8goLWudLVMmw&x-canva-quality=thumbnail"
          }
          os.makedirs("torres-cafe/assets", exist_ok=True)
          for name, url in urls.items():
              target = f"torres-cafe/assets/{name}.jpg"
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=35) as response:
                          data = response.read()
                      if len(data) < 1000 or data[:3] != b"\\xff\\xd8\\xff":
                          raise RuntimeError("Unexpected image response")
                      with open(target, "wb") as output: output.write(data)
                      print(name, len(data), "bytes")
                      break
                  except Exception as exc:
                      print(name, "retry", attempt, str(exc))
                      if attempt == 2: raise
                      time.sleep(3)
          with open("torres-cafe/index.html",encoding="utf-8") as inp: html=inp.read()
          for name, url in urls.items():
              html=html.replace(url, "assets/"+name+".jpg")
          with open("torres-cafe/index.html","w",encoding="utf-8") as out: out.write(html)
          
      - name: Publicar fotos na pasta da demonstracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torres-cafe/index.html torres-cafe/assets/
          git diff --cached --quiet || git commit -m "Torres Cafe: cache local photos for permanent preview"
          git push
