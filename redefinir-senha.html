<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Redefinir senha | XRMOVI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#114c57 0,transparent 42%),linear-gradient(135deg,#07121f,#081b2a);color:#eaf8ff;padding:20px}
main{width:min(460px,100%);padding:32px;border:1px solid #2c6271;border-radius:22px;background:#0b2334;box-shadow:0 25px 90px #0008}
h1{font-size:26px;margin:6px 0 10px}p{color:#b7d2db;line-height:1.55}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:7px;font-weight:700;font-size:13px}
input{width:100%;min-height:46px;border-radius:10px;padding:12px;background:#061725;color:white;border:1px solid #456778;font-size:16px}
button{min-height:46px;border:0;border-radius:10px;background:#29dfbd;color:#062a2a;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
a{color:#8ef0d9}#status{min-height:30px;font-size:13px}#status[data-error="true"]{color:#ffb0a9}
</style>
</head>
<body>
<main>
<a href="./?login=1">← Voltar ao XRMOVI</a>
<h1>Crie uma nova senha</h1>
<p>Use uma senha de pelo menos 8 caracteres. Esta página só altera a senha de uma sessão validada pelo Supabase.</p>
<form id="reset-form">
<label>Nova senha<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
<label>Confirmar nova senha<input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
<button type="submit" id="reset-submit" disabled>Validando link...</button>
<p id="status" role="status" aria-live="polite">Validando link de recuperação...</p>
</form>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const form=document.getElementById('reset-form'),button=document.getElementById('reset-submit'),status=document.getElementById('status');
const say=(message,error=false)=>{status.textContent=message;status.dataset.error=String(error)};
let client=null,ready=false;
try{
 const response=await fetch('./v3/config.json',{cache:'no-store'});
 if(!response.ok)throw Error('Configuração indisponível.');
 const config=await response.json();
 client=createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{detectSessionInUrl:true}});
 const enable=()=>{ready=true;button.disabled=false;button.textContent='Salvar nova senha';say('Link validado. Defina sua nova senha.')};
 client.auth.onAuthStateChange((event,session)=>{if(session&&(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN'||event==='INITIAL_SESSION'))enable()});
 const {data,error}=await client.auth.getSession();
 if(error)throw error;
 if(data.session)enable();
 else say('Link inválido ou expirado. Solicite um novo link em Entrar → Esqueci minha senha.',true);
}catch(error){say('Não foi possível validar o link: '+(error.message||'erro de conexão'),true)}
form.addEventListener('submit',async event=>{
 event.preventDefault();
 if(!ready||!client)return;
 const values=new FormData(form),password=String(values.get('password')||''),confirmation=String(values.get('confirm')||'');
 if(password.length<8||password!==confirmation){say('As senhas precisam coincidir e ter no mínimo 8 caracteres.',true);return}
 button.disabled=true;say('Atualizando senha...');
 try{
  const {error}=await client.auth.updateUser({password});
  if(error)throw error;
  await client.auth.signOut();
  say('Senha atualizada. Acesse a conta com sua nova senha.');
  button.textContent='Senha atualizada';
  const link=document.createElement('a');link.href='./?login=1';link.textContent='Entrar no XRMOVI';status.append(' ',link);
 }catch(error){button.disabled=false;say('Não foi possível atualizar a senha: '+(error.message||'tente novamente'),true)}
});
</script>
</body>
</html>
